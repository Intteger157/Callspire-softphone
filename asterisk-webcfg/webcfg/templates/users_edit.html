<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User editor</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 980px; }
      label { display: block; margin-top: 10px; font-weight: 600; }
      input { width: 420px; padding: 8px; }
      textarea { width: 100%; min-height: 340px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding: 10px; }
      .row { display: flex; gap: 10px; align-items: center; }
      a { color: #0b63ce; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .muted { color: #666; }
      .hint { font-size: 12px; color: #666; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="row">
      <h2 style="margin:0;">PJSIP User</h2>
      <a href="/users">Back</a>
    </div>

    <p class="muted">
      Этот экран генерирует include‑файл пользователя (endpoint/auth/aor) в <code>pjsip.d/users</code>.
    </p>

    <div class="grid">
      <div>
        <form method="post" action="/users/save">
          <label>Extension</label>
          <input name="extension" value="{{ user.extension if user else '' }}" {% if user %}readonly{% endif %} required />
          <div class="hint">Только цифры. При редактировании extension фиксирован.</div>

          <label>Password</label>
          <input name="password" value="" placeholder="{% if user %}Введите новый пароль чтобы заменить{% else %}Пароль SIP пользователя{% endif %}" {% if not user %}required{% endif %} />
          <div class="hint">Для существующего пользователя пароль меняется только если вы его введёте.</div>

          <label>Transport</label>
          <input name="transport" value="transport-tls" />

          <label>Context</label>
          <input name="context" value="from-internal" />

          <label>Allow codecs</label>
          <input name="allow" value="opus,alaw,ulaw,g722" />

          <label>Max contacts</label>
          <input name="max_contacts" type="number" value="2" />

          <label>Media encryption</label>
          <input name="media_encryption" value="sdes" />

          <div style="margin-top:14px;" class="row">
            <button type="submit">Save</button>
            <a href="/">Home</a>
          </div>
        </form>
      </div>

      <div>
        <label>Current file (read-only)</label>
        <textarea readonly>{% if user %}{{ user.raw }}{% else %}—{% endif %}</textarea>
      </div>
    </div>
  </body>
</html>
