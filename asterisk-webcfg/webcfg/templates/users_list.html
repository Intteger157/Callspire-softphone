<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PJSIP Users</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 980px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
      a { color: #0b63ce; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .row { display: flex; gap: 10px; align-items: center; }
      code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <div class="row">
      <h2 style="margin:0;">PJSIP Users</h2>
      <a href="/">Home</a>
      <a href="/users/new">New user</a>
    </div>

    <p class="muted">Пользователи = файлы <code>*.conf</code> в <code>pjsip.d/users</code>.</p>

    <table>
      <thead>
        <tr>
          <th>Extension</th>
          <th>File</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td><a href="/users/{{ u.extension }}">{{ u.extension }}</a></td>
          <td class="muted"><code>{{ u.path }}</code></td>
          <td>
            <form method="post" action="/users/{{ u.extension }}/delete" onsubmit="return confirm('Delete user {{ u.extension }}?')">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
        {% if users|length == 0 %}
        <tr><td colspan="3" class="muted">Нет пользователей (ещё не создано ни одного файла).</td></tr>
        {% endif %}
      </tbody>
    </table>
  </body>
</html>
