<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 980px; }
      pre { background: #0b0f14; color: #d6e1ff; padding: 14px; border-radius: 10px; overflow: auto; }
      .row { display: flex; gap: 10px; align-items: center; }
      a { color: #0b63ce; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .ok { color: #137333; font-weight: 700; }
      .bad { color: #b3261e; font-weight: 700; }
      code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="row">
      <h2 style="margin:0;">{{ title }}</h2>
      <a href="/">Home</a>
    </div>

    <p>
      Status:
      {% if res.ok %}
        <span class="ok">OK</span>
      {% else %}
        <span class="bad">FAILED</span>
      {% endif %}
      (exit: <code>{{ res.exit_code }}</code>)
    </p>
    <p>Command: <code>{{ " ".join(res.command) }}</code></p>

    {% if res.stdout %}
    <h3>stdout</h3>
    <pre>{{ res.stdout }}</pre>
    {% endif %}

    {% if res.stderr %}
    <h3>stderr</h3>
    <pre>{{ res.stderr }}</pre>
    {% endif %}
  </body>
</html>
