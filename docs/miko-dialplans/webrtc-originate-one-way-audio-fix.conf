; Callspire / MikoPBX dialplan patch
;
; Problem
; -------
; Outbound calls via PBX Originate → WebRTC softphone (52678419-WS) → trunk (Beeline):
;   - Operator → callee audio works (WS sends RTP, trunk receives).
;   - Callee → operator audio is silent after the trunk answers (200 OK).
;
; Asterisk/Miko logs show:
;   - During 183 Session Progress: RTP flows trunk → PBX → WebRTC (early media).
;   - After trunk 200 OK + simple_bridge: PBX stops forwarding inbound trunk RTP
;     to the WebRTC leg (no "Sent RTP" to client while callee speaks).
;
; Client-side re-INVITE does not fix this — the bridge on PBX must be refreshed.
;
; Fix
; ---
; When the Beeline trunk answers, run subroutine on the trunk channel and force
; a SIP session refresh (re-INVITE) on the bridged WebRTC leg (BRIDGEPEER).
;
; Install
; -------
; 1) Add [sub-beeline-answered] below to MikoPBX custom dialplan.
; 2) In your existing [outgoing-custom] beeline_dial, change Dial() to use U():
;
;    same => n(beeline_dial),NoOp(...)
;    same => n,Dial(PJSIP/${EXTEN}@SIP-TRUNK-BABC6857,60,tkKU(sub-beeline-answered,s,1))
;
; 3) Reload dialplan / apply custom config in Miko admin.
;
; Verify (one test call, rtp set debug on):
;   - After trunk 200 OK you should see BOTH:
;     Got RTP from 81.26.145.174 (trunk)
;     Sent RTP to 103.45.245.132 (WebRTC client)
;
; Filter logs for one user/extension:
;   grep -E '52678419|791834f5|103\.45\.245\.132' /path/to/asterisk.log
;   (use Call-ID prefix from softphone logs, e.g. 791834f5)

[sub-beeline-answered]
exten => s,1,NoOp([Callspire] sub-beeline-answered: trunk answered, refreshing WebRTC media)
 same => n,Set(CS_WS_PEER=${BRIDGEPEER})
 same => n,NoOp([Callspire] sub-beeline-answered: BRIDGEPEER=${CS_WS_PEER} trunk=${CHANNEL(name)})
 ; Refresh WebRTC leg first (operator hears callee)
 same => n,ExecIf($["${CS_WS_PEER}" != ""]?PJSIPSendRefresh(${CS_WS_PEER}))
 ; Optional: refresh trunk leg too (symmetric path)
 same => n,ExecIf($["${CHANNEL(name)}" != ""]?PJSIPSendRefresh(${CHANNEL}))
 same => n,Return()
