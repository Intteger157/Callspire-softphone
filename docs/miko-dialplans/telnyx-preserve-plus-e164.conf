; Callspire / MikoPBX dialplan patch
;
; Problem
; -------
; When a user dials an E.164 number (for example +3725504236), MikoPBX can strip
; the leading '+' (e.g. sends 3725504236 to the provider).
; Some providers (Telnyx in our case) will then normalize that as a "national"
; number using the SIP connection's default region and route the call incorrectly
; (for example, by prepending a default country code).
;
; Goal
; ----
; Preserve the original E.164 destination (including '+') all the way to the trunk
; Dial(), without changing MikoPBX core dialplan files.
;
; Where to install
; ----------------
; Put these contexts into MikoPBX "custom dialplan" (the place where Miko includes
; user-provided contexts like [outgoing-custom], [SIP-TRUNK-outgoing-ug-custom], etc).
;
; How it works (high level)
; -------------------------
; 1) MikoPBX stores the originally dialed destination (with '+') into `cleanNumber`
;    on the PJSIP channel.
; 2) [outgoing-custom] copies that into an inherited variable __CALLSPIRE_DST_E164.
; 3) [SIP-TRUNK-outgoing-ug-custom] runs right before the final trunk Dial(). At that
;    moment Miko already has DIAL_COMMAND like "PJSIP/<number>@<endpoint>".
;    We extract "<endpoint>" from the current DIAL_COMMAND and rebuild the command
;    using the preserved +E.164 number.
; 4) [dial_create_chan-custom] is a pre-dial handler for the B-leg. It ensures
;    CALLERID + P-Asserted-Identity reflect the chosen CID (USER_CID/CALLSPIRE_CID).
;
; Notes / assumptions
; -------------------
; - This patch relies on MikoPBX populating `cleanNumber` with the dialed destination.
;   If the user dials without '+', we still force a '+' prefix (naive guard-rail).
; - We only override DIAL_COMMAND when __CALLSPIRE_DST_E164 starts with '+' and we
;   were able to parse the trunk endpoint from the existing DIAL_COMMAND.
;

[outgoing-custom]
exten => _X.,1,NoOp([Callspire] outgoing-custom: EXTEN=${EXTEN} FROM_PEER=${FROM_PEER})
 same => n,NoOp([Callspire] DBG: CALLSPIRE_CID='${CALLSPIRE_CID}' pt1c_cid='${pt1c_cid}' CALLSPIRE_DST_E164='${CALLSPIRE_DST_E164}' pt1c_dst='${pt1c_dst}' cleanNumber='${cleanNumber}')
 same => n,Set(CS_TAIL=${CUT(FROM_PEER,-,2)})
 same => n,ExecIf($["${CS_TAIL}" = "WS"]?Set(__FROM_PEER=${CUT(FROM_PEER,-,1)}))

 ; E.164 destination — priority: inherited originate var, cleanNumber, pt1c_dst, EXTEN+digits
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${cleanNumber:0:1}" = "+"]?Set(__CALLSPIRE_DST_E164=${cleanNumber}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${cleanNumber}" != ""]?Set(__CALLSPIRE_DST_E164=+${cleanNumber}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${pt1c_dst:0:1}" = "+"]?Set(__CALLSPIRE_DST_E164=${pt1c_dst}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${pt1c_dst}" != ""]?Set(__CALLSPIRE_DST_E164=+${pt1c_dst}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${EXTEN:0:1}" = "+"]?Set(__CALLSPIRE_DST_E164=${EXTEN}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${EXTEN}" != ""]?Set(__CALLSPIRE_DST_E164=+${EXTEN}))
 same => n,NoOp([Callspire] DBG: CALLSPIRE_DST_E164='${CALLSPIRE_DST_E164}')

 ; CID source priority:
 ;   1) __CALLSPIRE_CID (inherited from Originate)
 ;   2) pt1c_cid
 ;   3) CALLERID(num) if already E.164 (starts with '+')
 same => n,ExecIf($["${CALLSPIRE_CID}" != ""]?Set(__USER_CID=${CALLSPIRE_CID}))
 same => n,ExecIf($["${USER_CID}" = "" & "${pt1c_cid}" != ""]?Set(__USER_CID=${pt1c_cid}))
 same => n,ExecIf($["${USER_CID}" = "" & "${CALLERID(num):0:1}" = "+"]?Set(__USER_CID=${CALLERID(num)}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(num)=${USER_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(name)=${USER_CID}))
 same => n,NoOp([Callspire] outgoing-custom: after FROM_PEER=${FROM_PEER} USER_CID=${USER_CID})
 same => n,Return()

; Called by MikoPBX after its built-in logic selected OUTGOING_CID/DOPTIONS,
; but before the final Dial() into the trunk.
[SIP-TRUNK-outgoing-ug-custom]
exten => _X.,1,NoOp([Callspire] ug-custom: before OUTGOING_CID=${OUTGOING_CID} DOPTIONS=${DOPTIONS} USER_CID=${USER_CID} CALLSPIRE_CID=${CALLSPIRE_CID})

 ; Extract everything after '@' from the existing dial command.
 same => n,Set(CS_TRUNK_EP=${CUT(DIAL_COMMAND,@,2)})

 ; Override the dialed number to preserved E.164 with '+'.
 same => n,ExecIf($["${CALLSPIRE_DST_E164:0:1}" = "+" & "${CS_TRUNK_EP}" != ""]?Set(number=${CALLSPIRE_DST_E164}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164:0:1}" = "+" & "${CS_TRUNK_EP}" != ""]?Set(DIAL_COMMAND=PJSIP/${CALLSPIRE_DST_E164}@${CS_TRUNK_EP}))
 same => n,NoOp([Callspire] ug-custom: dial override ep='${CS_TRUNK_EP}' number='${number}' DIAL_COMMAND='${DIAL_COMMAND}')

 ; Continue with standard CID logic
 same => n,ExecIf($["${USER_CID}" = "" & "${CALLSPIRE_CID}" != ""]?Set(__USER_CID=${CALLSPIRE_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(OUTGOING_CID=${USER_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(DOPTIONS=f(${USER_CID})))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(num)=${USER_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(name)=${USER_CID}))

 same => n,NoOp([Callspire] ug-custom: after OUTGOING_CID=${OUTGOING_CID} DOPTIONS=${DOPTIONS})
 same => n,Return()

; Pre-dial handler for the created B-leg (PJSIP/SIP-TRUNK-*). Runs after the channel
; is created but before INVITE is sent, so it reliably overrides f() and similar.
[dial_create_chan-custom]
exten => s,1,NoOp([Callspire] dial_create_chan-custom: endpoint=${CHANNEL(endpoint)} USER_CID=${USER_CID} CALLSPIRE_CID=${CALLSPIRE_CID})
 same => n,ExecIf($["${USER_CID}" = "" & "${CALLSPIRE_CID}" != ""]?Set(__USER_CID=${CALLSPIRE_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(num)=${USER_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(name)=${USER_CID}))
 ; P-Asserted-Identity: many providers (including Telnyx) treat it as trusted CLI
 same => n,ExecIf($["${USER_CID}" != ""]?Set(PJSIP_HEADER(remove,P-Asserted-Identity)=))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${USER_CID}@${CHANNEL(endpoint)}>))
 same => n,Return()

