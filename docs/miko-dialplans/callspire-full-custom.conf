; =============================================================================
; Callspire — полный custom dialplan для MikoPBX (intermark.global)
; =============================================================================
; Install: MikoPBX Admin → System → Custom dialplan → paste → Apply
;
; Requires gateway ami_client.py with:
;   Exten: digits-only (17027325111)
;   Variable: __CALLSPIRE_DST_E164=+17027325111
;   Variable: __CALLSPIRE_CID=<selected CallerID>
; =============================================================================

[outgoing-custom]
exten => _X.,1,NoOp([Callspire] outgoing-custom: EXTEN=${EXTEN} FROM_PEER=${FROM_PEER})
 same => n,NoOp([Callspire] DBG: CALLSPIRE_CID='${CALLSPIRE_CID}' pt1c_cid='${pt1c_cid}' CALLSPIRE_DST_E164='${CALLSPIRE_DST_E164}' pt1c_dst='${pt1c_dst}' cleanNumber='${cleanNumber}' CALLERID(num)='${CALLERID(num)}' OUTGOING_CID='${OUTGOING_CID}')
 same => n,Set(CS_TAIL=${CUT(FROM_PEER,-,2)})
 same => n,ExecIf($["${CS_TAIL}" = "WS"]?Set(__FROM_PEER=${CUT(FROM_PEER,-,1)}))

 ; E.164 destination — priority: __CALLSPIRE_DST_E164 (AMI) → cleanNumber → pt1c_dst → EXTEN
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${cleanNumber:0:1}" = "+"]?Set(__CALLSPIRE_DST_E164=${cleanNumber}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${cleanNumber}" != ""]?Set(__CALLSPIRE_DST_E164=+${cleanNumber}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${pt1c_dst:0:1}" = "+"]?Set(__CALLSPIRE_DST_E164=${pt1c_dst}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${pt1c_dst}" != ""]?Set(__CALLSPIRE_DST_E164=+${pt1c_dst}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${EXTEN:0:1}" = "+"]?Set(__CALLSPIRE_DST_E164=${EXTEN}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" = "" & "${EXTEN}" != ""]?Set(__CALLSPIRE_DST_E164=+${EXTEN}))
 ; Russian domestic: 8 + 10 digits → +7… (only +8 + 9xx…, 12 chars — not +852 Hong Kong)
 same => n,ExecIf($[${LEN(${CALLSPIRE_DST_E164})} = 12 & "${CALLSPIRE_DST_E164:0:2}" = "+8" & "${CALLSPIRE_DST_E164:2:1}" = "9"]?Set(__CALLSPIRE_DST_E164=+7${CALLSPIRE_DST_E164:2}))
 same => n,NoOp([Callspire] DBG: CALLSPIRE_DST_E164='${CALLSPIRE_DST_E164}')

 ; Caller ID (Originate / gateway)
 same => n,ExecIf($["${CALLSPIRE_CID}" != ""]?Set(__USER_CID=${CALLSPIRE_CID}))
 same => n,ExecIf($["${USER_CID}" = "" & "${pt1c_cid}" != ""]?Set(__USER_CID=${pt1c_cid}))
 same => n,ExecIf($["${USER_CID}" = "" & "${CALLERID(num):0:1}" = "+"]?Set(__USER_CID=${CALLERID(num)}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(num)=${USER_CID}))
 ; Имя НЕ трогаем — чтобы не пропадало из истории MikoPBX
 ; same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(name)=${USER_CID}))

 same => n,NoOp([Callspire] outgoing-custom: after FROM_PEER=${FROM_PEER} USER_CID=${USER_CID})
 same => n,Return()

 ; Forced Beeline — only when dialplan Goto(outgoing-custom,${EXTEN},beeline_dial)
 same => n(beeline_dial),NoOp([Callspire] FORCED ROUTING: Dialing via Beeline trunk SIP-TRUNK-6D859F5B)
 same => n,Set(CS_DIAL_NUM=${EXTEN})
 same => n,ExecIf($["${CALLSPIRE_DST_E164}" != ""]?Set(CS_DIAL_NUM=${CALLSPIRE_DST_E164}))
 same => n,NoOp([Callspire] beeline_dial: CS_DIAL_NUM=${CS_DIAL_NUM} USER_CID=${USER_CID})
 same => n,Dial(PJSIP/${CS_DIAL_NUM}@SIP-TRUNK-6D859F5B,60,tkKU(sub-beeline-answered,s,1))
 same => n,Hangup()


[SIP-TRUNK-outgoing-ug-custom]
exten => _X.,1,NoOp([Callspire] ug-custom: OUTGOING_CID=${OUTGOING_CID} DOPTIONS=${DOPTIONS} CALLSPIRE_DST_E164='${CALLSPIRE_DST_E164}')
 same => n,Set(CS_TRUNK_EP=${CUT(DIAL_COMMAND,@,2)})
 same => n,ExecIf($["${CALLSPIRE_DST_E164:0:1}" = "+" & "${CS_TRUNK_EP}" != ""]?Set(number=${CALLSPIRE_DST_E164}))
 same => n,ExecIf($["${CALLSPIRE_DST_E164:0:1}" = "+" & "${CS_TRUNK_EP}" != ""]?Set(DIAL_COMMAND=PJSIP/${CALLSPIRE_DST_E164}@${CS_TRUNK_EP}))
 same => n,NoOp([Callspire] ug-custom: ep='${CS_TRUNK_EP}' number='${number}' DIAL_COMMAND='${DIAL_COMMAND}')

 same => n,ExecIf($["${USER_CID}" = "" & "${CALLSPIRE_CID}" != ""]?Set(__USER_CID=${CALLSPIRE_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(OUTGOING_CID=${USER_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(DOPTIONS=f(${USER_CID})))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(num)=${USER_CID}))
 ; Имя НЕ трогаем — чтобы не пропадало из истории MikoPBX
 ; same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(name)=${USER_CID}))

 same => n,NoOp([Callspire] ug-custom: after OUTGOING_CID=${OUTGOING_CID} DOPTIONS=${DOPTIONS})
 same => n,Return()


[dial_create_chan-custom]
exten => s,1,NoOp([Callspire] dial_create_chan-custom: endpoint=${CHANNEL(endpoint)} USER_CID=${USER_CID})
 same => n,ExecIf($["${USER_CID}" = "" & "${CALLSPIRE_CID}" != ""]?Set(__USER_CID=${CALLSPIRE_CID}))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(num)=${USER_CID}))
 ; Имя НЕ трогаем — чтобы не пропадало из истории MikoPBX
 ; same => n,ExecIf($["${USER_CID}" != ""]?Set(CALLERID(name)=${USER_CID}))

 same => n,ExecIf($["${USER_CID}" != ""]?Set(PJSIP_HEADER(remove,P-Asserted-Identity)=))
 same => n,ExecIf($["${USER_CID}" != ""]?Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${USER_CID}@${CHANNEL(endpoint)}>))
 same => n,Return()


[sub-beeline-answered]
exten => s,1,NoOp([Callspire] sub-beeline-answered: trunk answered, refreshing WebRTC media)
 same => n,Set(CS_WS_PEER=${BRIDGEPEER})
 same => n,NoOp([Callspire] sub-beeline-answered: BRIDGEPEER=${CS_WS_PEER} trunk=${CHANNEL(name)})
 same => n,ExecIf($["${CS_WS_PEER}" != ""]?PJSIPSendRefresh(${CS_WS_PEER}))
 same => n,ExecIf($["${CHANNEL(name)}" != ""]?PJSIPSendRefresh(${CHANNEL}))
 same => n,Return()
