name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_MULTILEVEL_LOOKUP: "0"

jobs:
  release-windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Bundle ffmpeg (Windows x64 essentials)
        shell: pwsh
        run: |
          $destRoot = "tools/Windows"
          New-Item -ItemType Directory -Force -Path $destRoot | Out-Null
          $zip = "$env:RUNNER_TEMP/ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP/ffmpeg-extract -Force
          $folder = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-extract" -Directory | Select-Object -First 1
          if (-not $folder) { throw "ffmpeg extract folder not found" }
          Copy-Item -Recurse -Force $folder.FullName (Join-Path $destRoot $folder.Name)
          $ffmpegExe = Get-ChildItem (Join-Path $destRoot $folder.Name) -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found after extract" }
          Write-Host "Bundled ffmpeg: $($ffmpegExe.FullName)"

      - name: Build native AEC (webrtc_apm.dll, x64)
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 https://gitlab.xiph.org/xiph/speexdsp.git native-aec/speexdsp
          cmake -S native-aec -B native-aec/build -G "Visual Studio 17 2022" -A x64
          cmake --build native-aec/build --config Release
          if (-not (Test-Path native-aec/build/Release/webrtc_apm.dll)) {
            Write-Warning "webrtc_apm.dll was not produced; release will ship without native AEC"
          }

      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/windows

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -match '^v') { $version = $version.Substring(1) }
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc "/DMyAppVersion=$version" "installer\Callspire.iss"
          $setup = "Callspire-$version-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe not found: $setup" }
          $sizeMb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Created $setup ($sizeMb MB)"
          "setup=$setup" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.setup }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-windows-arm64:
    name: Windows ARM64 installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Bundle ffmpeg (Windows ARM64)
        shell: pwsh
        continue-on-error: true
        run: |
          $destRoot = "tools/Windows"
          New-Item -ItemType Directory -Force -Path $destRoot | Out-Null
          $zip = "$env:RUNNER_TEMP/ffmpeg-winarm64.zip"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP/ffmpeg-arm64-extract -Force
          $bin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-arm64-extract" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe not found in ARM64 bundle" }
          $folder = Join-Path $destRoot "ffmpeg-winarm64-ci"
          New-Item -ItemType Directory -Force -Path (Join-Path $folder "bin") | Out-Null
          Copy-Item -Force $bin.FullName (Join-Path $folder "bin\ffmpeg.exe")
          Write-Host "Bundled ARM64 ffmpeg: $folder\bin\ffmpeg.exe"

      - name: Build native AEC (webrtc_apm.dll, ARM64)
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 https://gitlab.xiph.org/xiph/speexdsp.git native-aec/speexdsp
          cmake -S native-aec -B native-aec/build-arm64 -G "Visual Studio 17 2022" -A ARM64
          cmake --build native-aec/build-arm64 --config Release
          if (-not (Test-Path native-aec/build-arm64/Release/webrtc_apm.dll)) {
            Write-Warning "webrtc_apm.dll (ARM64) was not produced"
          }

      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=false -o publish/windows

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -match '^v') { $version = $version.Substring(1) }
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc "/DMyAppVersion=$version" "installer\Callspire-arm64.iss"
          $setup = "Callspire-$version-win-arm64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe not found: $setup" }
          $sizeMb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Created $setup ($sizeMb MB)"
          "setup=$setup" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.setup }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-macos:
    name: macOS (${{ matrix.arch_label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            arch_label: arm64
            dmg_suffix: arm64
          - arch: x86_64
            arch_label: x64
            dmg_suffix: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Callspire.app + DMG (unsigned)
        run: bash Callspire.Mac/Scripts/package-dmg.sh --arch ${{ matrix.arch }} --ci

      - name: Rename release assets
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v* ]]; then VERSION="${VERSION#v}"; fi
          APP="$(find publish/macos -name 'Callspire.app' -type d | head -1)"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "Callspire-${VERSION}-macos-${{ matrix.arch_label }}-unsigned.zip"
          if [[ -f "publish/macos/Callspire-${{ matrix.dmg_suffix }}.dmg" ]]; then
            mv "publish/macos/Callspire-${{ matrix.dmg_suffix }}.dmg" "Callspire-${VERSION}-macos-${{ matrix.arch_label }}-unsigned.dmg"
          fi
          ls -la "Callspire-${VERSION}-macos-${{ matrix.arch_label }}-"* || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Callspire-*-macos-${{ matrix.arch_label }}-unsigned.zip
            Callspire-*-macos-${{ matrix.arch_label }}-unsigned.dmg
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
