name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Use SDK from actions/setup-dotnet only — ignore preinstalled SDK 10 on runners.
  DOTNET_MULTILEVEL_LOOKUP: '0'

jobs:

  # ─── Windows Desktop ─────────────────────────────────────────────────────
  build-windows:
    name: Windows Desktop
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      # On Windows runner all Desktop TFMs are supported — full restore + RID (no -p:TargetFramework filter).
      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-x64 --no-self-contained -o publish/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-windows-x64
          path: publish/windows
          retention-days: 30

  # ─── macOS Desktop ────────────────────────────────────────────────────────
  build-macos:
    name: macOS Desktop
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Build (net8.0 / Avalonia)
        run: dotnet build Callspire.Desktop/Callspire.Desktop.csproj -f net8.0 -c Release

      # Self-contained .app bundle (Info.plist with callspire:// + microphone usage, icon).
      # Unsigned in CI (ad-hoc); sign/notarize locally with macOS/package-app.sh --sign … --dmg.
      - name: Package Callspire.app (arm64)
        run: bash Callspire.Desktop/macOS/package-app.sh --arch arm64 --config Release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-arm64-app
          path: publish/macos/Callspire.app
          retention-days: 30

  # ─── Linux Desktop ────────────────────────────────────────────────────────
  build-linux:
    name: Linux Desktop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Install PortAudio
        run: sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Restore
        run: dotnet restore Callspire.Desktop/Callspire.Desktop.csproj -p:TargetFramework=net8.0 -r linux-x64

      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0 -c Release -r linux-x64 --no-self-contained --no-restore -o publish/linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-linux-x64
          path: publish/linux
          retention-days: 30

  # ─── Android APK (experimental) ─────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.422'
          global-json-file: global.json

      - name: Verify SDK version
        run: dotnet --version

      - name: Install Android workload
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Set Android SDK root
        run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Publish APK
        run: dotnet publish Callspire.Android/Callspire.Android.csproj -f net8.0-android34.0 -c Release -p:CheckEolWorkloads=false -p:AndroidSdkDirectory=${{ env.ANDROID_SDK_ROOT }} -o publish/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-android-apk
          path: publish/android/*.apk
          retention-days: 30
