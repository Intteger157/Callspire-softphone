name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Use SDK from actions/setup-dotnet only — ignore preinstalled SDK 10 on runners.
  DOTNET_MULTILEVEL_LOOKUP: '0'

jobs:

  # ─── Windows Desktop ─────────────────────────────────────────────────────
  build-windows:
    name: Windows Desktop
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      # On Windows runner all Desktop TFMs are supported — full restore + RID (no -p:TargetFramework filter).
      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-x64 --no-self-contained -o publish/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-windows-x64
          path: publish/windows
          retention-days: 30

  # ─── macOS sidecar ────────────────────────────────────────────────────────
  build-macos:
    name: macOS Service sidecar
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Publish Callspire.Service (osx-arm64)
        run: bash Callspire.Mac/Scripts/build-service.sh arm64 Release

      - name: Upload macOS sidecar
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-service-arm64
          path: publish/macos/Service
          retention-days: 30
