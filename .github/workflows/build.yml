name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Use SDK from actions/setup-dotnet only — ignore preinstalled SDK 10 on runners.
  DOTNET_MULTILEVEL_LOOKUP: '0'

jobs:

  # ─── Windows Desktop ─────────────────────────────────────────────────────
  build-windows:
    name: Windows Desktop
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      # On Windows runner all Desktop TFMs are supported — full restore + RID (no -p:TargetFramework filter).
      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-x64 --no-self-contained -o publish/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-windows-x64
          path: publish/windows
          retention-days: 30

  # ─── macOS app (SwiftUI + embedded sidecar) ───────────────────────────────
  build-macos:
    name: macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Callspire.app (unsigned, CI)
        run: bash Callspire.Mac/Scripts/package-dmg.sh --arch arm64 --ci

      - name: Zip .app for artifact download
        run: |
          APP="$(find publish/macos -name 'Callspire.app' -type d | head -1)"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" publish/macos/Callspire-macos-arm64-unsigned.zip

      - name: Upload macOS app (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-arm64-unsigned
          path: publish/macos/Callspire-macos-arm64-unsigned.zip
          retention-days: 30

      - name: Upload macOS sidecar (Service folder only)
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-service-arm64
          path: publish/macos/Service
          retention-days: 30
          if-no-files-found: ignore
