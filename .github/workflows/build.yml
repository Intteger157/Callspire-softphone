name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Use SDK from actions/setup-dotnet only — ignore preinstalled SDK 10 on runners.
  DOTNET_MULTILEVEL_LOOKUP: '0'

jobs:

  # ─── Windows Desktop (x64) ───────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-x64 --no-self-contained -o publish/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-windows-x64
          path: publish/windows
          retention-days: 30

  # ─── Windows Desktop (ARM64) ───────────────────────────────────────────
  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Publish
        run: dotnet publish Callspire.Desktop/Callspire.Desktop.csproj -f net8.0-windows10.0.17763 -c Release -r win-arm64 --no-self-contained -o publish/windows-arm64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: callspire-windows-arm64
          path: publish/windows-arm64
          retention-days: 30

  # ─── macOS app (Apple Silicon) ─────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Callspire.app (unsigned, CI)
        run: |
          set -o pipefail
          mkdir -p publish/macos
          bash Callspire.Mac/Scripts/package-dmg.sh --arch arm64 --ci 2>&1 | tee publish/macos/xcodebuild-arm64.log

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-xcodebuild-log
          path: publish/macos/xcodebuild-arm64.log
          if-no-files-found: ignore

      - name: Surface xcodebuild errors
        if: failure()
        run: |
          LOG="publish/macos/xcodebuild-arm64.log"
          if [ -f "$LOG" ]; then
            grep -E " error:" "$LOG" | head -40 | while IFS= read -r line; do
              echo "::error title=xcodebuild::${line}"
            done
          fi

      - name: Zip .app for artifact download
        run: |
          APP="$(find publish/macos -name 'Callspire.app' -type d | head -1)"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" publish/macos/Callspire-macos-arm64-unsigned.zip

      - name: Upload macOS app (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-arm64-unsigned
          path: publish/macos/Callspire-macos-arm64-unsigned.zip
          retention-days: 30

      - name: Upload macOS sidecar (Service folder only)
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-service-arm64
          path: publish/macos/Service
          retention-days: 30
          if-no-files-found: ignore

  # ─── macOS app (Intel x64) ─────────────────────────────────────────────
  build-macos-x64:
    name: macOS x64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Callspire.app (unsigned, CI)
        run: |
          set -o pipefail
          mkdir -p publish/macos
          bash Callspire.Mac/Scripts/package-dmg.sh --arch x86_64 --ci 2>&1 | tee publish/macos/xcodebuild-x64.log

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-xcodebuild-log
          path: publish/macos/xcodebuild-x64.log
          if-no-files-found: ignore

      - name: Surface xcodebuild errors
        if: failure()
        run: |
          LOG="publish/macos/xcodebuild-x64.log"
          if [ -f "$LOG" ]; then
            grep -E " error:" "$LOG" | head -40 | while IFS= read -r line; do
              echo "::error title=xcodebuild::${line}"
            done
          fi

      - name: Zip .app for artifact download
        run: |
          APP="$(find publish/macos -name 'Callspire.app' -type d | head -1)"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" publish/macos/Callspire-macos-x64-unsigned.zip

      - name: Upload macOS app (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-x64-unsigned
          path: publish/macos/Callspire-macos-x64-unsigned.zip
          retention-days: 30

      - name: Upload macOS sidecar (Service folder only)
        uses: actions/upload-artifact@v4
        with:
          name: callspire-macos-service-x64
          path: publish/macos/Service
          retention-days: 30
          if-no-files-found: ignore
